name: bookshelf-api

x-app-env: &app-env
  DATABASE_URL: jdbc:postgresql://postgres:5432/bookshelf
  DATABASE_USER: bookshelf
  DATABASE_PASSWORD: bookshelf-local-only
  REDIS_ENABLED: "true"
  REDIS_URL: redis://:redis-local-only@redis:6379/0

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bookshelf
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: bookshelf-local-only
    ports: ["127.0.0.1:5432:5432"]
    # PostgreSQL 18 uses /var/lib/postgresql/18/docker beneath this mount.
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshelf -d bookshelf"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    command: ["redis-server", "--requirepass", "redis-local-only", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-local-only", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: migrate
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: api
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      HTTP_HOST: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health"]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 20s

  worker:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: worker
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  test:
    profiles: ["test"]
    build: {context: ., target: test}
    environment:
      <<: *app-env
      TEST_DATABASE_URL: jdbc:postgresql://postgres:5432/bookshelf
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres-data:
